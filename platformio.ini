; =====================================================================
;  ESP32 Audio Processor - Bluetooth A2DP -> effets -> PCM5102 (I2S)
;  Carte : Freenove ESP32-WROVER-E (4 Mo flash, 8 Mo PSRAM)
; =====================================================================

[env:esp32-wrover]
platform  = espressif32@6.9.0          ; Arduino-ESP32 2.0.17 (ESP-IDF 4.4)
board     = esp32dev
framework = arduino

board_build.partitions = huge_app.csv  ; la pile Bluetooth Classic est volumineuse
board_build.f_cpu      = 240000000L
board_build.f_flash    = 80000000L

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7
    bodmer/TFT_eSPI@2.5.43

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    ; --- PSRAM (WROVER) ---
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1

    ; --- ESP32-A2DP : on gere l'I2S nous-memes (pas besoin d'AudioTools) ---
    -DA2DP_I2S_AUDIOTOOLS=0

    ; --- Ecran : configuration TFT_eSPI (ST7735 1.8" 128x160 SPI) ---
    ; Si les couleurs/bordures sont fausses, essayer ST7735_GREENTAB,
    ; ST7735_GREENTAB2, ST7735_REDTAB a la place de ST7735_BLACKTAB.
    ; Si rouge et bleu sont inverses : ajouter -DTFT_RGB_ORDER=TFT_BGR
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DST7735_BLACKTAB=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=4
    -DTFT_RST=21
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=27000000
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
